name: cloud_quest
description: "CW-02 #03 Firebase Cloud Quest: Auth, Firestore, a one-time reward Function and a supervised AI Quest Coach."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  # tools/setup.sh pins these two to the newest versions that match firebase_core.
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
